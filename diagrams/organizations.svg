<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>.root{fill:#183b64;stroke:#102a45;stroke-width:2}.ou{fill:#e8f0f8;stroke:#5d86aa;stroke-width:2}.acct{fill:#fff;stroke:#7894ad;stroke-width:2}.line{stroke:#7894ad;stroke-width:3;fill:none}.white{font:bold 19px Arial;fill:#fff}.title{font:bold 17px Arial;fill:#18324b}.body{font:14px Arial;fill:#30465c}.small{font:12px Arial;fill:#52677a}</style>
<rect width="1200" height="760" fill="#f7f9fc"/>
<text x="600" y="28" text-anchor="middle" class="title">HarborPoint — Proposed AWS Organization</text>
<rect x="380" y="45" width="440" height="86" rx="12" class="root"/><text x="600" y="79" text-anchor="middle" class="white">AWS Organization Root</text><text x="600" y="106" text-anchor="middle" style="font:14px Arial;fill:#fff">Management account and member-account OUs</text>
<path d="M600 131 V165 H600 M100 165 H1100 M100 165 V195 M300 165 V195 M500 165 V195 M700 165 V195 M900 165 V195 M1100 165 V195" class="line"/>
<rect x="20" y="195" width="160" height="80" rx="9" class="acct"/><text x="100" y="226" text-anchor="middle" class="title">Management</text><text x="100" y="250" text-anchor="middle" class="body">Billing • Org admin</text><text x="100" y="267" text-anchor="middle" class="small">No workloads</text>
<rect x="220" y="195" width="160" height="80" rx="9" class="ou"/><text x="300" y="226" text-anchor="middle" class="title">Security OU</text><text x="300" y="250" text-anchor="middle" class="body">Audit • Monitoring</text>
<rect x="420" y="195" width="160" height="80" rx="9" class="ou"/><text x="500" y="226" text-anchor="middle" class="title">Infrastructure OU</text><text x="500" y="250" text-anchor="middle" class="body">Shared platform</text>
<rect x="620" y="195" width="160" height="80" rx="9" class="ou"/><text x="700" y="226" text-anchor="middle" class="title">Development OU</text><text x="700" y="250" text-anchor="middle" class="body">Engineering</text>
<rect x="820" y="195" width="160" height="80" rx="9" class="ou"/><text x="900" y="226" text-anchor="middle" class="title">Testing OU</text><text x="900" y="250" text-anchor="middle" class="body">QA • Integration</text>
<rect x="1020" y="195" width="160" height="80" rx="9" class="ou"/><text x="1100" y="226" text-anchor="middle" class="title">Production OU</text><text x="1100" y="250" text-anchor="middle" class="body">Live workloads</text>
<path d="M300 275 V320 H245 V350 M300 320 H355 V350 M500 275 V350 M700 275 V350 M900 275 V350 M1100 275 V350" class="line"/>
<rect x="170" y="350" width="150" height="105" rx="9" class="acct"/><text x="245" y="388" text-anchor="middle" class="title">Log Archive</text><text x="245" y="415" text-anchor="middle" class="body">Central audit logs</text><text x="245" y="438" text-anchor="middle" class="small">Restricted access</text>
<rect x="280" y="490" width="150" height="105" rx="9" class="acct"/><text x="355" y="528" text-anchor="middle" class="title">Security Tooling</text><text x="355" y="555" text-anchor="middle" class="body">Monitoring</text><text x="355" y="578" text-anchor="middle" class="small">Investigation</text>
<rect x="425" y="350" width="150" height="105" rx="9" class="acct"/><text x="500" y="388" text-anchor="middle" class="title">Shared Services</text><text x="500" y="415" text-anchor="middle" class="body">Network • DNS</text><text x="500" y="438" text-anchor="middle" class="small">Platform services</text>
<rect x="625" y="350" width="150" height="105" rx="9" class="acct"/><text x="700" y="388" text-anchor="middle" class="title">Development</text><text x="700" y="415" text-anchor="middle" class="body">Build • Experiment</text><text x="700" y="438" text-anchor="middle" class="small">Non-production</text>
<rect x="825" y="350" width="150" height="105" rx="9" class="acct"/><text x="900" y="388" text-anchor="middle" class="title">Test</text><text x="900" y="415" text-anchor="middle" class="body">QA • Integration</text><text x="900" y="438" text-anchor="middle" class="small">Validation</text>
<rect x="1025" y="350" width="150" height="105" rx="9" class="acct"/><text x="1100" y="388" text-anchor="middle" class="title">Production</text><text x="1100" y="415" text-anchor="middle" class="body">Customer-facing</text><text x="1100" y="438" text-anchor="middle" class="small">Strict change control</text>
<text x="600" y="700" text-anchor="middle" class="small">Conceptual design • Separate member accounts provide primary environment isolation</text></svg>